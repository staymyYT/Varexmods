<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Downloads - VAREX Mods</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 30px auto;
            padding-bottom: 15px;
            border-bottom: 2px solid #29292e;
        }

        h1 {
            color: #00875f;
        }

        nav a {
            color: #e1e1e6;
            text-decoration: none;
            margin-left: 15px;
            padding: 8px 16px;
            background-color: #202024;
            border-radius: 6px;
            transition: 0.2s;
        }

        nav a:hover, nav a.active {
            background-color: #00875f;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #29292e;
            background-color: #202024;
            color: #fff;
            font-size: 16px;
        }

        .mod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .mod-card {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .mod-card:hover {
            transform: translateY(-4px);
            border-color: #00875f;
        }

        .mod-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .mod-version {
            font-size: 12px;
            color: #00875f;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .mod-desc {
            font-size: 14px;
            color: #a8a8b3;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .download-btn {
            display: block;
            text-align: center;
            background-color: #00875f;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #00b37e;
        }

        .no-mods {
            text-align: center;
            color: #a8a8b3;
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>VAREX Mods</h1>
        <nav>
            <a href="index.html" class="active">Downloads</a>
            <a href="about.html">Mod Hochladen</a>
        </nav>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="Mod suchen..." oninput="filterMods()">
        <div id="modList" class="mod-grid"></div>
    </div>

    <script>
        let loadedMods = [];

        function loadMods() {
            const savedMods = localStorage.getItem('varex_mods');
            loadedMods = savedMods ? JSON.parse(savedMods) : [];
            displayMods(loadedMods);
        }

        function displayMods(mods) {
            const modList = document.getElementById('modList');
            modList.innerHTML = '';

            if (mods.length === 0) {
                modList.innerHTML = '<div class="no-mods">Noch keine Mods hochgeladen. Gehe auf "Mod Hochladen", um deine erste Mod hinzuzufügen!</div>';
                return;
            }

            mods.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'mod-card';
                card.innerHTML = `
                    <div>
                        <div class="mod-title">${escapeHtml(mod.name)}</div>
                        <div class="mod-version">Version: ${escapeHtml(mod.version)}</div>
                        <div class="mod-desc">${escapeHtml(mod.description)}</div>
                    </div>
                    <a href="${mod.fileData}" download="${mod.fileName}" class="download-btn">Download (${mod.fileName})</a>
                `;
                modList.appendChild(card);
            });
        }

        function filterMods() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = loadedMods.filter(mod => 
                mod.name.toLowerCase().includes(query) || 
                mod.description.toLowerCase().includes(query)
            );
            displayMods(filtered);
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        window.onload = loadMods;
    </script>
</body>
</html>
