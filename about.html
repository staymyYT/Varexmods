<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Hochladen - VAREX Mods</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 30px auto;
            padding-bottom: 15px;
            border-bottom: 2px solid #29292e;
        }

        h1 {
            color: #00875f;
        }

        nav a {
            color: #e1e1e6;
            text-decoration: none;
            margin-left: 15px;
            padding: 8px 16px;
            background-color: #202024;
            border-radius: 6px;
            transition: 0.2s;
        }

        nav a:hover, nav a.active {
            background-color: #00875f;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #202024;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #29292e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #29292e;
            background-color: #121214;
            color: #fff;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            background-color: #00875f;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #00b37e;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .success {
            background-color: #123825;
            color: #00b37e;
            border: 1px solid #00875f;
        }

        .clear-btn {
            background-color: #a83232;
            margin-top: 20px;
        }

        .clear-btn:hover {
            background-color: #c94444;
        }
    </style>
</head>
<body>

    <header>
        <h1>VAREX Mods</h1>
        <nav>
            <a href="index.html">Downloads</a>
            <a href="about.html" class="active">Mod Hochladen</a>
        </nav>
    </header>

    <div class="container">
        <h2>Neue Mod hochladen</h2>
        <br>
        <form id="uploadForm">
            <div class="form-group">
                <label for="modName">Mod Name</label>
                <input type="text" id="modName" required placeholder="z. B. Spiderman Fabric Mod">
            </div>

            <div class="form-group">
                <label for="modVersion">Minecraft Version / Mod Version</label>
                <input type="text" id="modVersion" required placeholder="z. B. 1.21.8 / v1.0">
            </div>

            <div class="form-group">
                <label for="modDesc">Beschreibung</label>
                <textarea id="modDesc" required placeholder="Beschreibe, was die Mod macht..."></textarea>
            </div>

            <div class="form-group">
                <label for="modFile">Mod Datei (.jar, .zip, etc.)</label>
                <input type="file" id="modFile" required>
            </div>

            <button type="submit">Mod Speichern & Veröffentlichen</button>
        </form>

        <div id="statusMessage" class="message success">Mod erfolgreich gespeichert! Sie wird jetzt unter Downloads angezeigt.</div>

        <button class="clear-btn" onclick="clearAllMods()">Alle gespeicherten Mods löschen</button>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('modName').value;
            const version = document.getElementById('modVersion').value;
            const description = document.getElementById('modDesc').value;
            const fileInput = document.getElementById('modFile');
            const file = fileInput.files[0];

            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const fileData = event.target.result; // Base64 kodierte Datei

                const newMod = {
                    id: Date.now(),
                    name: name,
                    version: version,
                    description: description,
                    fileName: file.name,
                    fileData: fileData
                };

                // Vorhandene Mods aus localStorage laden
                const existingMods = JSON.parse(localStorage.getItem('varex_mods')) || [];
                existingMods.push(newMod);

                // Im localStorage speichern
                try {
                    localStorage.setItem('varex_mods', JSON.stringify(existingMods));
                    
                    // Erfolgsmeldung
                    const msg = document.getElementById('statusMessage');
                    msg.style.display = 'block';
                    document.getElementById('uploadForm').reset();
                    
                    setTimeout(() => { msg.style.display = 'none'; }, 4000);
                } catch (err) {
                    alert('Fehler: Die Datei ist zu groß für den lokalen Browser-Speicher!');
                }
            };

            reader.readAsDataURL(file);
        });

        function clearAllMods() {
            if (confirm('Möchtest du wirklich alle hochgeladenen Mods aus dem Speicher löschen?')) {
                localStorage.removeItem('varex_mods');
                alert('Alle Mods wurden gelöscht.');
            }
        }
    </script>
</body>
</html>
